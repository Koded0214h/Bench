[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "0.0.1"
description = "A company staffed by AI agents that actually do the work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "solari-browser>=0.1.3",
    "solari-sandbox>=0.2.0",
    "solari-desktop>=0.2.0",
    "PyYAML>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bench.policy" = ["*.yaml"]
"bench.metering" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
