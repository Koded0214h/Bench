<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench — live</title>
<style>
  :root { color-scheme: light dark; --bg:#0b0d10; --fg:#e7e9ec; --dim:#8b929c; --line:#232833;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fafafa; --fg:#1a1d21; --dim:#6b7280; --line:#e5e7eb; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  header .meta { color:var(--dim); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); }
  section { background:var(--bg); padding:16px 20px; min-height:180px; }
  section h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0 0 12px; }
  .row { padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .t { font-weight:600; }
  .row .s { color:var(--dim); font-size:12px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; border:1px solid var(--line); }
  .pill.ok{color:var(--ok);border-color:var(--ok)} .pill.run{color:var(--accent);border-color:var(--accent)}
  .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
  a { color:var(--accent); }
  .empty { color:var(--dim); font-style:italic; }
  button { font:inherit; background:transparent; color:var(--accent); border:1px solid var(--accent);
           border-radius:6px; padding:2px 10px; cursor:pointer; }
  footer { padding:10px 20px; color:var(--dim); border-top:1px solid var(--line); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>BENCH</h1>
  <span class="meta" id="meta">connecting…</span>
</header>
<main>
  <section><h2>Goals</h2><div id="goals"></div></section>
  <section><h2>Workers</h2><div id="agents"></div></section>
  <section><h2>Machines</h2><div id="machines"></div></section>
  <section><h2>Escalations — need a human</h2><div id="escalations"></div></section>
</main>
<footer id="foot">polling /api every 2s · this is a stopgap view; the real frontend consumes the same API</footer>

<script>
const PILL = { done:"ok", ready:"ok", active:"run", running:"run", quarantine:"run", review:"run",
               pending:"warn", escalated:"warn", blocked:"warn",
               failed:"bad", denied:"bad", rejected:"bad", destroyed:"", dismissed:"" };
const pill = s => `<span class="pill ${PILL[s]||""}">${s}</span>`;
const j = u => fetch(u).then(r => r.json());

function rows(el, items, render) {
  el.innerHTML = items.length ? items.map(render).join("") : `<div class="empty">none</div>`;
}

async function tick() {
  try {
    const [goals, agents, machines, escs, health] = await Promise.all([
      j("/api/goals?limit=20"), j("/api/agents?active=1"), j("/api/machines?live=1"),
      j("/api/escalations?pending=1"), j("/healthz"),
    ]);
    document.getElementById("meta").textContent =
      `${health.goals} goals · ${health.live_machines} live machines · ${new Date().toLocaleTimeString()}`;

    rows(document.getElementById("goals"), goals.results || goals, g => `
      <div class="row"><div class="t">${g.text.slice(0,90)} ${pill(g.status)}</div>
      <div class="s">${g.id} · ${(g.tasks||[]).length} task(s)${g.error ? " · <span style='color:var(--bad)'>"+g.error.slice(0,80)+"</span>" : ""}</div></div>`);

    rows(document.getElementById("agents"), agents.results || agents, a => `
      <div class="row"><div class="t">${a.role} ${pill(a.status)}</div>
      <div class="s">${a.id} · ${a.kind}${a.task_id ? " · task "+a.task_id : ""}</div></div>`);

    rows(document.getElementById("machines"), machines.results || machines, m => `
      <div class="row"><div class="t">${m.kind} ${pill(m.status)}</div>
      <div class="s">${m.id.slice(0,42)}${m.stream_url ? ` · <a href="${m.stream_url}" target="_blank">stream</a>` : ""}
      ${Object.entries(m.preview_urls||{}).map(([p,u]) => `· <a href="${u}" target="_blank">:${p}</a>`).join(" ")}</div></div>`);

    rows(document.getElementById("escalations"), escs.results || escs, e => `
      <div class="row"><div class="t">task ${e.task_id} ${pill(e.status)}</div>
      <div class="s">${e.reason}</div>
      <div style="margin-top:6px"><button onclick="resolve('${e.id}',true)">approve</button>
      <button onclick="resolve('${e.id}',false)" style="border-color:var(--bad);color:var(--bad)">reject</button></div></div>`);
  } catch (err) {
    document.getElementById("meta").textContent = "error: " + err;
  }
}

async function resolve(id, approved) {
  await fetch(`/api/escalations/${id}/resolve/`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ approved, resolved_by: "live-view" }),
  });
  tick();
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
